name: Verify channel downgrade and return

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Industrial-Arcane-Society/form-recall
          ref: 374ebb6efb5b708c77e6e751c9d9e6ba37a4ac54
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/apps/native-desktop/go.mod
          cache-dependency-path: src/apps/native-desktop/go.sum
      - name: Verify Beta.3 to Alpha.4 and return using the shared archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = 'Industrial-Arcane-Society/form-recall'
          $from = '0.3.0-beta.3'
          $lower = '0.3.0-alpha.4'
          $name = "FormRecall-$from-windows-x64"
          $root = Join-Path $env:RUNNER_TEMP 'FormRecall round trip 渠道'
          New-Item -ItemType Directory -Path $root | Out-Null
          gh release download "v$from" --repo $repo --dir $root --pattern "$name-portable.zip"
          $zip = Join-Path $root "$name-portable.zip"
          $rel = gh api "repos/$repo/releases/tags/v$from" | ConvertFrom-Json
          $digest = ($rel.assets | Where-Object name -CEQ "$name-portable.zip").digest
          if ($digest -cne ('sha256:' + (Get-FileHash -LiteralPath $zip).Hash.ToLowerInvariant())) { throw 'Base archive digest mismatch.' }
          $baseCommit = (gh api "repos/$repo/git/ref/tags/v$from" | ConvertFrom-Json).object.sha
          $lowerCommit = (gh api "repos/$repo/git/ref/tags/v$lower" | ConvertFrom-Json).object.sha
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $root)
          $bundle = Join-Path $root $name
          ./scripts/verify-desktop-ota.ps1 -BundleDirectory $bundle -ExpectedVersion $lower -ExpectedCommit $lowerCommit -OutputDirectory evidence/downgrade -AllowDowngrade -UseSoftwareOpenGL
          ./scripts/verify-desktop-ota.ps1 -BundleDirectory $bundle -ExpectedVersion $from -ExpectedCommit $baseCommit -OutputDirectory evidence/return -ContinueFromActive -ExpectCrossChannelDelta -UseSoftwareOpenGL
      - name: Upload verification proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-channel-roundtrip
          path: |
            evidence
            !evidence/**/session-data/**
          if-no-files-found: warn